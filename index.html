<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ef4d83">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ミレイカウンター">
<title>御薬袋ミレイのパワーカウンター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#ec3d76;--pink2:#ff9fbe;--pale:#fff3f7;--line:#efb0c4;
  --green:#7be000;--blue:#0755b8;--purple:#63188f;--red:#df1023;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--pale);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
button{font:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.app{
 width:100vw;height:100dvh;min-height:100%;padding:max(3px,env(safe-area-inset-top))
 max(4px,env(safe-area-inset-right)) max(3px,env(safe-area-inset-bottom))
 max(4px,env(safe-area-inset-left));background:linear-gradient(135deg,#fffafd,#ffeef4)
}
.title{
 height:9%;min-height:34px;display:flex;align-items:center;justify-content:center;
 position:relative;overflow:hidden;border:2px solid #ef719a;border-radius:12px;
 background:
  radial-gradient(circle at 5% 25%,#ffffffdd 0 2px,transparent 3px),
  radial-gradient(circle at 9% 65%,#f68db0 0 3px,transparent 4px),
  radial-gradient(circle at 91% 35%,#ffffffdd 0 2px,transparent 3px),
  radial-gradient(circle at 96% 70%,#f68db0 0 3px,transparent 4px),
  linear-gradient(90deg,#ffb7cf,#fff8fa 50%,#ffb7cf);
 color:#e52d66;font-weight:1000;font-size:clamp(17px,3.25vw,38px);
 letter-spacing:.02em;text-shadow:0 2px #fff
}
.title::before,.title::after{position:absolute;color:#ef6f9b;opacity:.85;font-size:clamp(16px,2.4vw,30px);line-height:1}
.title::before{content:"✿  ❀";left:3%}
.title::after{content:"❀  ✿";right:3%}
.main{
 height:91%;display:grid;grid-template-columns:minmax(88px,13%) 1fr minmax(150px,19%);
 gap:4px;padding-top:4px
}
.panel{border:1.5px solid var(--line);border-radius:11px;background:#fff9fb}
.left{padding:4px;display:grid;grid-template-rows:repeat(5,1fr) 1.35fr 1.35fr;gap:4px}
.e-btn,.toggle{border-radius:8px;border:1px solid #777;font-weight:900;box-shadow:0 2px 1px #0003}
.e-btn{font-size:clamp(16px,2.15vw,28px)}
.e-btn.pos{background:linear-gradient(#fff,#eee);color:#55b900}
.e-btn.neg{background:linear-gradient(#292929,#070707);color:#fff}
.e-display{display:flex;align-items:center;justify-content:center;border-radius:8px;background:#080808;
 color:var(--green);font:bold clamp(20px,2.4vw,34px) ui-monospace,Consolas,monospace}
.toggle{color:#fff;font-size:clamp(10px,1.25vw,18px);padding:3px;line-height:1.05}
.persona{background:linear-gradient(#f32c58,#cb0035)}
.bow{background:linear-gradient(#1973db,#00449d)}
.toggle.off{filter:grayscale(1);opacity:.55}

.center{display:grid;grid-template-rows:1fr 15%;gap:4px;min-width:0}
.counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;min-height:0}
.counter{
 padding:4px;display:grid;grid-template-rows:21% 13% 13% 1fr;gap:4px;min-width:0
}
.power{
 display:flex;align-items:center;justify-content:center;background:#030303;border-radius:8px;color:var(--green);
 font:900 clamp(25px,3.9vw,56px)/1 ui-monospace,Consolas,monospace;
 letter-spacing:-.085em;overflow:hidden;box-shadow:inset 0 0 10px #000
}
.power.nonzero .first{color:#ff2727}
.minirow{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:3px}
.mini,.mini-btn{display:flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid #555;
 font-weight:900;font-size:clamp(11px,1.48vw,20px)}
.mini{background:#111;color:#fff}.star{color:#ffd500}.drive{color:#f32626}
.mini-btn{background:linear-gradient(#fff,#eee);color:#111;box-shadow:0 2px 1px #0002}
.pbuttons{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:4px;min-height:0}
.pbtn{border-radius:8px;color:#111!important;font-weight:900;font-size:clamp(11px,1.42vw,20px);
 box-shadow:0 2px 1px #0003;background:linear-gradient(#fff,#ececec)!important;border:1px solid #777!important}
.pbtn.mid{background:linear-gradient(#2a2a2a,#050505)!important;border-color:#000!important;color:#fff!important}
.rainbow{background:linear-gradient(90deg,#ff2d2d,#ff9800,#ffe600,#37d837,#27b7ff,#4b4bff,#b32dff)!important;color:#fff!important;border:1px solid #555}
.reset-btn{border-radius:8px;color:#fff;font-weight:900;font-size:clamp(11px,1.42vw,20px);box-shadow:0 2px 1px #0003;background:linear-gradient(#ff2933,#bd0008);border:1px solid #920005}

.front{padding:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
 background:linear-gradient(90deg,#e462c3,#f5a8df,#d94fc0)}
.front button{border-radius:8px;border:1px solid #35105b;background:linear-gradient(#7d28a8,#4a077a);
 color:#fff;font-weight:900;font-size:clamp(12px,1.75vw,24px);box-shadow:0 3px 1px #0003}

.right{padding:4px;display:grid;grid-template-rows:22% 39% 1fr;gap:4px;min-width:0}
.dice{border:2px solid #ef5b8c;border-radius:11px;background:linear-gradient(145deg,#ff9fc0,#f04c82);
 color:#fff;display:flex;align-items:center;justify-content:center;gap:8%;box-shadow:inset 0 0 0 3px #ffcadd}
.die-face{font-size:clamp(34px,4.8vw,68px)}.die-result{font:900 clamp(22px,3.8vw,50px) ui-monospace,monospace}
.dice.rolling{animation:shake .12s linear infinite}@keyframes shake{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.allreset{position:relative;overflow:hidden;border:2px solid #df356c;border-radius:11px;
 background:linear-gradient(#f66795,#e52f6d);color:#fff;display:flex;flex-direction:column;align-items:center;
 justify-content:center;box-shadow:inset 0 0 0 3px #ffb7ce}
.all-title{font-weight:1000;font-size:clamp(22px,3.65vw,50px);line-height:.88;text-shadow:0 2px #b60040}
.all-note{font-weight:800;font-size:clamp(8px,1.1vw,15px);margin-top:5px}
.progress{position:absolute;left:0;bottom:0;height:7px;width:0;background:#ffffff88}
.allreset.success{animation:flash .5s}@keyframes flash{50%{filter:brightness(1.8)}}

.character-stage{position:relative;overflow:hidden;border-radius:10px;min-height:0;background:transparent;touch-action:none}
.character-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.character-stage .normal{object-position:center 23%;transform:scale(1.08)}
.character-stage .hold{object-position:center 24%;opacity:0;transform:scale(1.14)}
.character-stage.is-held .normal{opacity:0}
.character-stage.is-held .hold{opacity:1}
.character-hint{position:absolute;right:5px;bottom:4px;padding:2px 5px;border-radius:8px;
 background:#ffffffbb;color:#b51650;font-size:clamp(7px,.82vw,11px);font-weight:800}

button:active{transform:translateY(2px);filter:brightness(.92)}
@media(orientation:portrait){
 body{overflow:auto}.app{min-width:900px;min-height:430px}
}
@media(max-height:400px){
 .title{height:8%;min-height:28px}.main{height:92%}
 .all-note{margin-top:2px}.left,.right,.counter,.front{padding:3px;gap:3px}
 .center,.counters{gap:3px}
}
</style>
</head>
<body>
<main class="app">
<header class="title">御薬袋ミレイのパワーカウンター</header>
<section class="main">
<aside class="left panel">
<button class="e-btn pos" data-e="3">+3</button>
<button class="e-btn pos" data-e="1">+1</button>
<div id="eDisplay" class="e-display">E0</div>
<button class="e-btn neg" data-e="-1">−1</button>
<button class="e-btn neg" data-e="-3">−3</button>
<button id="persona" class="toggle persona">ペルソナライド</button>
<button id="bow" class="toggle bow">ボウダナート</button>
</aside>

<section class="center">
<div id="counters" class="counters"></div>
<div class="front panel">
<button data-front="1000">前 +1000</button>
<button data-front="5000">前 +5000</button>
<button data-front="10000">前 +10000</button>
</div>
</section>

<aside class="right panel">
<button id="dice" class="dice" aria-label="サイコロを振る">
<span id="dieFace" class="die-face">⚄</span><span id="dieResult" class="die-result">−</span>
</button>
<button id="allReset" class="allreset">
<span class="all-title">ALL<br>RESET</span>
<span class="all-note">長押し1秒で<br>Eカウンターもリセット</span>
<span id="progress" class="progress"></span>
</button>
<div id="characterStage" class="character-stage" aria-label="御薬袋ミレイ">

<template id="counterTemplate">
<article class="counter panel">
<div class="power"><span class="first">0</span><span class="rest">000000</span></div>
<div class="minirow">
<div class="mini star">★1</div><button class="mini-btn star-plus">★+1</button><button class="mini-btn star-minus">★−1</button>
</div>
<div class="minirow">
<div class="mini drive">D±0</div><button class="mini-btn drive-plus">D+1</button><button class="mini-btn drive-minus">D−1</button>
</div>
<div class="pbuttons">
<button class="pbtn" data-delta="1000">+1000</button>
<button class="pbtn" data-delta="5000">+5000</button>
<button class="pbtn mid" data-delta="10000">+10000</button>
<button class="pbtn mid" data-delta="20000">+20000</button>
<button class="pbtn rainbow" data-delta="1000000">+1億</button>
<button class="reset-btn">RESET</button>
</div>
</article>
</template>

<script>
(()=>{
"use strict";
const KEY="mirei-counter-v1-final",MAX=9999999,FACES=["⚀","⚁","⚂","⚃","⚄","⚅"];
const fresh=()=>({e:0,persona:false,bow:true,dice:null,characterAlt:false,counters:Array.from({length:3},()=>({power:0,star:1,drive:0}))});
let state=load();

const countersEl=document.getElementById("counters"),tpl=document.getElementById("counterTemplate"),cards=[];
for(let i=0;i<3;i++){const card=tpl.content.firstElementChild.cloneNode(true);card.dataset.i=i;countersEl.appendChild(card);cards.push(card);wireCard(card,i)}

const eDisplay=document.getElementById("eDisplay"),persona=document.getElementById("persona"),bow=document.getElementById("bow");
const dice=document.getElementById("dice"),dieFace=document.getElementById("dieFace"),dieResult=document.getElementById("dieResult");
const allReset=document.getElementById("allReset"),progress=document.getElementById("progress"),character=document.getElementById("characterStage");

document.querySelectorAll("[data-e]").forEach(b=>repeat(b,()=>{state.e=clamp(state.e+Number(b.dataset.e),0,10);commit()}));
document.querySelectorAll("[data-front]").forEach(b=>repeat(b,()=>{const d=Number(b.dataset.front);state.counters.forEach(c=>c.power=clamp(c.power+d,0,MAX));commit()}));

persona.onclick=()=>{const d=state.persona?-10000:10000;state.persona=!state.persona;state.counters.forEach(c=>c.power=clamp(c.power+d,0,MAX));commit()};
bow.onclick=()=>{state.bow=!state.bow;commit()};
dice.onclick=rollDice;
wireAllReset();
render();

function wireCard(card,i){
 card.querySelectorAll("[data-delta]").forEach(b=>repeat(b,()=>{
  const delta=Number(b.dataset.delta);
  state.counters[i].power=clamp(state.counters[i].power+delta,0,MAX);
  if(delta===1000000) state.characterAlt=true;
  commit();
}));
 card.querySelector(".star-plus").onclick=()=>{state.counters[i].star=clamp(state.counters[i].star+1,0,99);commit()};
 card.querySelector(".star-minus").onclick=()=>{state.counters[i].star=clamp(state.counters[i].star-1,0,99);commit()};
 card.querySelector(".drive-plus").onclick=()=>{state.counters[i].drive=clamp(state.counters[i].drive+1,-9,9);commit()};
 card.querySelector(".drive-minus").onclick=()=>{state.counters[i].drive=clamp(state.counters[i].drive-1,-9,9);commit()};
 card.querySelector(".reset-btn").onclick=()=>{
   state.counters[i]={power:0,star:1,drive:0};
   commit();
 };
}
function rollDice(){
 if(dice.classList.contains("rolling"))return;
 dice.classList.add("rolling");let n=0;
 const t=setInterval(()=>{const v=rand();dieFace.textContent=FACES[v-1];dieResult.textContent=v;
 if(++n>=12){clearInterval(t);state.dice=rand();dice.classList.remove("rolling");commit()}},65)
}
function wireAllReset(){
 let p=null,longTimer=null,progTimer=null,longDone=false,start=0;
 const clear=()=>{clearTimeout(longTimer);clearInterval(progTimer);progress.style.width="0%"};
 allReset.addEventListener("pointerdown",e=>{if(p!==null)return;e.preventDefault();p=e.pointerId;longDone=false;start=performance.now();allReset.setPointerCapture?.(p);
 progTimer=setInterval(()=>progress.style.width=Math.min(100,(performance.now()-start)/10)+"%",50);
 longTimer=setTimeout(()=>{longDone=true;resetAll(true);allReset.classList.add("success");setTimeout(()=>allReset.classList.remove("success"),500);navigator.vibrate?.(40)},1000)});
 allReset.addEventListener("pointerup",e=>{if(e.pointerId!==p)return;e.preventDefault();clear();if(!longDone)resetAll(false);p=null});
 allReset.addEventListener("pointercancel",()=>{clear();p=null});allReset.oncontextmenu=e=>e.preventDefault()
}
function resetAll(withE){
  state.counters=Array.from({length:3},()=>({power:0,star:1,drive:0}));
  state.persona=false;
  state.bow=true;
  state.dice=null;
  state.characterAlt=false;
  if(withE)state.e=0;
  commit();
}
function repeat(el,fn){
 let p=null,startTimer=null,repeatTimer=null,ms=190;
 const stop=e=>{if(e&&p!==null&&e.pointerId!==p)return;clearTimeout(startTimer);clearTimeout(repeatTimer);p=null;ms=190};
 const go=()=>{fn();ms=Math.max(55,ms-14);repeatTimer=setTimeout(go,ms)};
 el.addEventListener("pointerdown",e=>{if(p!==null)return;e.preventDefault();p=e.pointerId;el.setPointerCapture?.(p);fn();startTimer=setTimeout(go,420)});
 el.addEventListener("pointerup",stop);el.addEventListener("pointercancel",stop);el.addEventListener("lostpointercapture",()=>stop());el.oncontextmenu=e=>e.preventDefault()
}
function render(){
 character.classList.toggle("is-held",!!state.characterAlt);
 eDisplay.textContent="E"+state.e;persona.classList.toggle("off",!state.persona);bow.classList.toggle("off",!state.bow);
 dieResult.textContent=state.dice??"−";dieFace.textContent=state.dice?FACES[state.dice-1]:"⚄";
 cards.forEach((card,i)=>{const c=state.counters[i],shown=c.power<=99999?String(c.power):String(c.power).padStart(7,"0"),p=card.querySelector(".power");
 p.querySelector(".first").textContent=shown.length===7?shown[0]:"";
 p.querySelector(".rest").textContent=shown.length===7?shown.slice(1):shown;
 p.classList.toggle("nonzero",c.power>0);
 card.querySelector(".star").textContent="★"+c.star;card.querySelector(".drive").textContent=c.drive===0?"D±0":"D"+(c.drive>0?"+":"")+c.drive})
}
function commit(){render();localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.counters?.length===3?{...fresh(),...x}:fresh()}catch{return fresh()}}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}function rand(){return Math.floor(Math.random()*6)+1}
})();
</script>
</body>
</html>
