<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6d3be">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パワーカウンター">
<title>パワーカウンター</title>
<style>
:root {
  --pink1:#ff7d9b;
  --pink2:#e94c73;
  --pink-dark:#a93a54;
  --gray1:#a8a8ab;
  --gray2:#727277;
  --paper:#fff8f3;
  --paper2:#fff0e9;
  --line:#e5aaa1;
  --green:#91dc3b;
  --red:#ff2929;
  --blue1:#3274e2;
  --blue2:#0c43aa;
  --reset1:#ff493e;
  --reset2:#d20d17;
  --shadow:rgba(75,36,27,.25);
}
* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body {
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 15% 4%,rgba(255,255,255,.55),transparent 24%),
    repeating-linear-gradient(90deg,#f8dac2 0 5px,#f3ceb4 6px 11px);
}
body {
  min-height:100svh;
  padding:
    max(6px,env(safe-area-inset-top))
    max(6px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(6px,env(safe-area-inset-left));
  overflow-x:auto;
}
button {
  font:inherit;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
}
.app {
  width:100%;
  min-width:900px;
  max-width:1550px;
  margin:0 auto;
}
.header-row {
  display:grid;
  grid-template-columns:1fr 1.18fr 1fr;
  gap:12px;
  margin:5px 12px 12px;
}
.header-title,.mode-button {
  min-height:62px;
  border:3px solid #b54a60;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:clamp(22px,3vw,40px);
  font-weight:900;
  letter-spacing:.04em;
  text-shadow:0 3px 2px rgba(128,38,61,.58);
  box-shadow:0 6px 0 #a75a50,0 10px 18px var(--shadow);
}
.header-title {
  background:linear-gradient(var(--pink1),var(--pink2));
}
.mode-button {
  background:linear-gradient(var(--gray1),var(--gray2));
}
.mode-button.on {
  background:linear-gradient(var(--pink1),var(--pink2));
}
.cards {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  padding:0 12px;
}
.counter-card {
  min-width:0;
  padding:12px;
  border:2px solid var(--line);
  border-radius:18px;
  background:linear-gradient(var(--paper),var(--paper2));
  box-shadow:0 5px 0 #d7a48e,0 9px 17px var(--shadow);
}
.lcd {
  height:clamp(88px,10vw,125px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px 9px;
  background:#080a08;
  border:6px solid #202020;
  border-radius:14px;
  box-shadow:inset 0 0 18px #000,0 4px 0 #6a5148;
  overflow:hidden;
}
.digit {
  font-family:"Courier New",monospace;
  font-size:clamp(57px,6.5vw,92px);
  line-height:1;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.11em;
}
.high {
  min-width:.72em;
  text-align:center;
  color:var(--green);
}
.high.active {
  color:var(--red);
  text-shadow:0 0 10px rgba(255,39,39,.65);
}
.low {
  color:var(--green);
  text-shadow:0 0 8px rgba(145,220,59,.42);
}
.three-row {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}
.display-box,.small-button {
  min-height:clamp(45px,5vw,61px);
  border:2px solid #191919;
  border-radius:10px;
  font-size:clamp(20px,2.4vw,31px);
  font-weight:900;
  box-shadow:0 4px 0 #796c65;
}
.display-box {
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(#292622,#070707);
}
.star-display { color:#ffd700; }
.star-button {
  background:linear-gradient(#292622,#070707);
  color:#fff;
}
.d-display { color:#ff2929; }
.d-button {
  background:linear-gradient(#fff,#e8e8e8);
  color:#111;
}
.power-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}
.power-button,.reset-button {
  min-height:clamp(50px,5.5vw,70px);
  border-radius:11px;
  color:#fff;
  font-size:clamp(20px,2.4vw,31px);
  font-weight:900;
}
.power-button {
  border:2px solid #0a327f;
  background:linear-gradient(var(--blue1),var(--blue2));
  box-shadow:0 5px 0 #082b72;
}
.reset-button {
  border:2px solid #961118;
  background:linear-gradient(var(--reset1),var(--reset2));
  box-shadow:0 5px 0 #8d1017;
}
.all-reset {
  position:relative;
  width:calc(100% - 24px);
  min-height:clamp(145px,18vw,220px);
  margin:14px 12px 0;
  overflow:hidden;
  border:3px solid #b03956;
  border-radius:22px;
  background:linear-gradient(120deg,var(--pink1),var(--pink2));
  box-shadow:0 7px 0 #a53d51,0 12px 22px var(--shadow);
  color:#fff;
  font-size:clamp(48px,7vw,86px);
  font-weight:900;
  letter-spacing:.04em;
  text-shadow:0 3px 2px #b73b59;
}
.all-reset .label {
  position:relative;
  z-index:4;
}
.mascot {
  position:absolute;
  bottom:0;
  z-index:2;
  height:100%;
  width:26%;
  object-fit:cover;
  pointer-events:none;
}
.mascot.left {
  left:0;
}
.mascot.right {
  right:0;
}
.message {
  height:24px;
  margin-top:7px;
  color:#853849;
  text-align:center;
  font-size:15px;
  font-weight:800;
}
button:active {
  transform:translateY(3px);
  filter:brightness(.92);
}
@media (max-width:1000px) {
  .app { min-width:860px; }
  .header-row { gap:8px; }
  .counter-card { padding:9px; }
  .cards { gap:7px; }
}
@media (orientation:portrait) {
  body::after {
    content:"横向きにすると操作しやすくなります";
    position:fixed;
    z-index:99;
    left:50%;
    bottom:max(8px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    padding:7px 14px;
    border-radius:999px;
    background:rgba(0,0,0,.76);
    color:#fff;
    font-size:12px;
    pointer-events:none;
  }
}
</style>
</head>
<body>

  <header class="header-row">
    <div class="header-title">パワーカウンター</div>
    <button type="button" id="persona" class="mode-button">ペルソナライド</button>
    <button type="button" id="boudanaato" class="mode-button on">ボウダナート</button>
  </header>

  <section id="cards" class="cards">
    
    <section class="counter-card" data-index="0">

      <div class="three-row">
        <div id="star-0" class="display-box star-display">★1</div>
        <button type="button" class="small-button star-button" data-action="starPlus">★＋1</button>
        <button type="button" class="small-button star-button" data-action="starMinus">★－1</button>
      </div>

      <div class="three-row">
        <div id="d-0" class="display-box d-display">D±0</div>
        <button type="button" class="small-button d-button" data-action="dPlus">D＋1</button>
        <button type="button" class="small-button d-button" data-action="dMinus">D－1</button>
      </div>

      <div class="power-grid">
        <button type="button" class="power-button" data-add="1000">＋1000</button>
        <button type="button" class="power-button" data-add="5000">＋5000</button>
        <button type="button" class="power-button" data-add="10000">＋10000</button>
        <button type="button" class="power-button" data-add="20000">＋20000</button>
        <button type="button" class="power-button" data-add="1000000">＋1億</button>
        <button type="button" class="reset-button" data-action="reset">RESET</button>
      </div>
    </section>
    
    <section class="counter-card" data-index="1">
      <div class="lcd" aria-label="7桁パワー表示">

        <span id="low-1" class="digit low">000000</span>
      </div>

        <div id="star-1" class="display-box star-display">★1</div>
        <button type="button" class="small-button star-button" data-action="starPlus">★＋1</button>
        <button type="button" class="small-button star-button" data-action="starMinus">★－1</button>
      </div>

      <div class="three-row">
        <div id="d-1" class="display-box d-display">D±0</div>
        <button type="button" class="small-button d-button" data-action="dPlus">D＋1</button>
        <button type="button" class="small-button d-button" data-action="dMinus">D－1</button>
      </div>

      <div class="power-grid">
        <button type="button" class="power-button" data-add="1000">＋1000</button>
        <button type="button" class="power-button" data-add="5000">＋5000</button>
        <button type="button" class="power-button" data-add="10000">＋10000</button>
        <button type="button" class="power-button" data-add="20000">＋20000</button>
        <button type="button" class="power-button" data-add="1000000">＋1億</button>
        <button type="button" class="reset-button" data-action="reset">RESET</button>
      </div>
    </section>
    
    <section class="counter-card" data-index="2">
      <div class="lcd" aria-label="7桁パワー表示">
        <span id="high-2" class="digit high">0</span>
        <span id="low-2" class="digit low">000000</span>
      </div>

      <div class="three-row">
        <div id="star-2" class="display-box star-display">★1</div>
        <button type="button" class="small-button star-button" data-action="starPlus">★＋1</button>
        <button type="button" class="small-button star-button" data-action="starMinus">★－1</button>
      </div>

      <div class="three-row">
        <div id="d-2" class="display-box d-display">D±0</div>
        <button type="button" class="small-button d-button" data-action="dPlus">D＋1</button>
        <button type="button" class="small-button d-button" data-action="dMinus">D－1</button>
      </div>

      <div class="power-grid">
        <button type="button" class="power-button" data-add="1000">＋1000</button>
        <button type="button" class="power-button" data-add="5000">＋5000</button>
        <button type="button" class="power-button" data-add="10000">＋10000</button>
        <button type="button" class="power-button" data-add="20000">＋20000</button>
        <button type="button" class="power-button" data-add="1000000">＋1億</button>
        <button type="button" class="reset-button" data-action="reset">RESET</button>
      </div>
    </section>
    
  </section>

  <div id="message" class="message"></div>
</main>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "power-counter-character-v1";
  const MAX_POWER = 9999999;

  const cards = document.getElementById("cards");
  const persona = document.getElementById("persona");
  const boudanaato = document.getElementById("boudanaato");
  const message = document.getElementById("message");

  let state = {
    counters: [
      { power:0, star:1, d:0 },
      { power:0, star:1, d:0 },
      { power:0, star:1, d:0 }
    ],
    persona:false,
    boudanaato:true
  };

  const clamp = (value,min,max) => Math.max(min,Math.min(max,value));

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.counters) && saved.counters.length === 3) {
        state = saved;
      }
    } catch (error) {
      console.warn("保存データを読み込めませんでした",error);
    }

    state.counters = state.counters.map(counter => ({
      power:clamp(Number(counter.power)||0,0,MAX_POWER),
      star:clamp(Number(counter.star)||1,1,99),
      d:clamp(Number(counter.d)||0,-9,9)
    }));
    state.persona = Boolean(state.persona);
    state.boudanaato = state.boudanaato !== false;
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    } catch (error) {
      console.warn("保存できませんでした",error);
    }
  }

  function dLabel(value) {
    if (value === 0) return "D±0";
    return value > 0 ? "D+" + value : "D" + value;
  }

  function render() {
    state.counters.forEach((counter,index) => {
      const text = String(counter.power).padStart(7,"0");
      const high = document.getElementById("high-" + index);

      high.textContent = text[0];
      high.classList.toggle("active",text[0] !== "0");
      document.getElementById("low-" + index).textContent = text.slice(1);
      document.getElementById("star-" + index).textContent = "★" + counter.star;
      document.getElementById("d-" + index).textContent = dLabel(counter.d);
    });

    persona.classList.toggle("on",state.persona);
    boudanaato.classList.toggle("on",state.boudanaato);
    save();
  }

  function showMessage(text) {
    message.textContent = text;
    clearTimeout(showMessage.timer);
    showMessage.timer = setTimeout(() => message.textContent = "",1300);
  }

  cards.addEventListener("click",event => {
    const button = event.target.closest("button");
    if (!button) return;

    const card = button.closest(".counter-card");
    const index = Number(card.dataset.index);
    const counter = state.counters[index];

    if (button.dataset.add) {
      counter.power = clamp(
        counter.power + Number(button.dataset.add),
        0,
        MAX_POWER
      );
    }

    switch (button.dataset.action) {
      case "starPlus":
        counter.star = clamp(counter.star + 1,1,99);
        break;
      case "starMinus":
        counter.star = clamp(counter.star - 1,1,99);
        break;
      case "dPlus":
        counter.d = clamp(counter.d + 1,-9,9);
        break;
      case "dMinus":
        counter.d = clamp(counter.d - 1,-9,9);
        break;
      case "reset":
        counter.power = 0;
        counter.star = 1;
        counter.d = 0;
        break;
    }

    render();
  });

  persona.addEventListener("click",() => {
    state.persona = !state.persona;

    if (state.persona) {
      state.counters.forEach(counter => {
        counter.power = clamp(counter.power + 10000,0,MAX_POWER);
      });
      showMessage("3つのカウンターに＋10000しました");
    }

    render();
  });

  boudanaato.addEventListener("click",() => {
    state.boudanaato = !state.boudanaato;
    render();
  });

  document.getElementById("allReset").addEventListener("click",() => {
    state.counters = [
      { power:0, star:1, d:0 },
      { power:0, star:1, d:0 },
      { power:0, star:1, d:0 }
    ];
    state.persona = false;
    state.boudanaato = true;

    render();
    showMessage("すべて初期状態に戻しました");
  });

  load();
  render();
})();
</script>
